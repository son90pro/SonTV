name: Build DaoTV JSON Feeds

on:
  schedule:
    - cron: "0 * * * *" # Chạy tự động mỗi giờ
  workflow_dispatch: # Cho phép bấm Run workflow thủ công trên GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run M3U to JSON converter
        run: python build_feeds.py

      - name: Commit and push updated JSON files
        run: |
          ls -la
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for f in Giaitri.json truyen_hinh.json the_thao.json; do
            [ -f "$f" ] && git add "$f" || echo "Skip missing file: $f"
          done
          git diff --staged --quiet || git commit -m "Auto update TV & Sports JSON feeds"
          git push
          
