name: Update Playlist JSON

on:
  schedule:
    # Chạy tự động mỗi 6 tiếng (UTC: 00:00, 06:00, 12:00, 18:00)
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # Cho phép bấm chạy thủ công ngay trên tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist.json
        run: python build_playlist.py

      - name: Commit and push if playlist.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới."
          else
            git commit -m "chore: update playlist.json"
            git push
          fi
